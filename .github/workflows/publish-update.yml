name: Publish ReactWoo Support Connector Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Must match the connector plugin header. The git tag is not used."
        required: false
      restore:
        description: "Set true to publish the plugin header even when the catalog is already higher. The value must be the header."
        required: false
        default: "false"
      channel:
        description: "Release channel"
        required: false
        default: "stable"
      rollout_percentage:
        description: "Rollout percentage (0-100)"
        required: false
        default: "100"
  workflow_call:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: reactwoo-support-connector
      MAIN_PHP: reactwoo-support-connector/reactwoo-support-connector.php
      README_TXT: reactwoo-support-connector/readme.txt
      API_PUBLISH_URL: https://api.reactwoo.com/api/v5/updates/publish
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Create plugin zip
        run: python scripts/package_zip.py

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # The catalog version is the connector plugin header. A git tag is not a version.
          CATALOG="$(
            python3 - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://api.reactwoo.com/api/v5/updates/check",
              data=json.dumps(
                  {
                      "slug": "reactwoo-support-connector",
                      "current_version": "0.0.0",
                      "channel": "${{ github.event.inputs.channel || 'stable' }}",
                      "site_host": "github-actions",
                  }
              ).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          version = payload.get("version") if isinstance(payload, dict) else ""
          print(version or "")
          PY
          )"
          echo "Catalog version: ${CATALOG:-none}"

          RESTORE=""
          if [[ "${{ github.event.inputs.restore || 'false' }}" == "true" ]]; then
            RESTORE="$(sed -n "s/^ \* Version: //p" "${MAIN_PHP}" | head -n1 | tr -d '\r')"
          fi

          python3 scripts/resolve_connector_release.py \
            --main "${MAIN_PHP}" \
            --zip "${PLUGIN_SLUG}.zip" \
            --requested "${{ github.event.inputs.version || '' }}" \
            --catalog "${CATALOG}" \
            --restore "${RESTORE}" \
            --restore-file scripts/connector-catalog-restore.txt \
            --github-output "$GITHUB_OUTPUT"

          VERSION="$(python3 - <<'PY'
          import os
          import re
          text = open(os.environ["MAIN_PHP"], encoding="utf-8").read()
          match = re.search(r"^[ \t]*\*[ \t]*Version:[ \t]*(\S+)", text, re.MULTILINE)
          print(match.group(1) if match else "")
          PY
          )"
          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine plugin version."
            exit 1
          fi

          MIN_PHP="$(sed -n "s/^ \* Requires PHP: //p" "${MAIN_PHP}" | head -n1 | tr -d '\r')"
          if [[ -z "${MIN_PHP}" ]]; then
            MIN_PHP="$(sed -n "s/^Requires PHP: //p" "${README_TXT}" | head -n1 | tr -d '\r')"
          fi

          TESTED_UP_TO="$(sed -n "s/^Tested up to: //p" "${README_TXT}" | head -n1 | tr -d '\r')"
          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          ROLLOUT="${{ github.event.inputs.rollout_percentage || '100' }}"
          ARTIFACT_KEY="plugins/${PLUGIN_SLUG}/${VERSION}/${PLUGIN_SLUG}.zip"
          LATEST_KEY="plugins/${PLUGIN_SLUG}/latest/${PLUGIN_SLUG}.zip"
          LATEST_META_KEY="plugins/${PLUGIN_SLUG}/latest.json"
          SHA256="$(sha256sum "${PLUGIN_SLUG}.zip" | awk '{print $1}')"

          echo "min_php=${MIN_PHP}" >> "$GITHUB_OUTPUT"
          echo "tested_up_to=${TESTED_UP_TO}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "rollout=${ROLLOUT}" >> "$GITHUB_OUTPUT"
          echo "artifact_key=${ARTIFACT_KEY}" >> "$GITHUB_OUTPUT"
          echo "latest_key=${LATEST_KEY}" >> "$GITHUB_OUTPUT"
          echo "latest_meta_key=${LATEST_META_KEY}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS CLI for R2
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set region auto

      - name: Validate and normalize R2 endpoint
        if: steps.meta.outputs.publish == 'true'
        id: r2
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ secrets.R2_ENDPOINT }}"
          ENDPOINT="$(printf '%s' "${RAW}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ENDPOINT="${ENDPOINT%/}"

          if [[ -z "${ENDPOINT}" ]]; then
            echo "R2_ENDPOINT secret is empty."
            exit 1
          fi

          if [[ ! "${ENDPOINT}" =~ ^https?:// ]]; then
            echo "R2_ENDPOINT must start with http:// or https://"
            exit 1
          fi

          echo "::add-mask::${ENDPOINT}"
          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"

      - name: Upload zip to R2
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "${PLUGIN_SLUG}.zip" "s3://${{ secrets.R2_BUCKET }}/${{ steps.meta.outputs.artifact_key }}" \
            --endpoint-url "${{ steps.r2.outputs.endpoint }}" \
            --content-type "application/zip" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Publish release metadata to API
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          payload = {
              "slug": "${{ env.PLUGIN_SLUG }}",
              "version": "${{ steps.meta.outputs.version }}",
              "channel": "${{ steps.meta.outputs.channel }}",
              "artifact_key": "${{ steps.meta.outputs.artifact_key }}",
              "sha256": "${{ steps.meta.outputs.sha256 }}",
              "min_php": "${{ steps.meta.outputs.min_php }}",
              "tested_up_to": "${{ steps.meta.outputs.tested_up_to }}",
              "rollout_percentage": int("${{ steps.meta.outputs.rollout }}"),
          }
          with open("publish-payload.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, separators=(",", ":"))
          PY
          python -m json.tool publish-payload.json >/dev/null

          response="$(curl --fail-with-body -sS -X POST "${API_PUBLISH_URL}" \
            --http1.1 \
            --retry 8 --retry-delay 15 \
            -H "Authorization: Bearer ${{ secrets.UPDATES_PUBLISH_TOKEN }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @publish-payload.json)"
          printf '%s\n' "${response}"
          VERSION="${{ steps.meta.outputs.version }}" python3 -c '
          import json, os, sys
          data = json.loads(sys.stdin.read() or "{}")
          latest = str(data.get("latest") or "")
          version = os.environ.get("VERSION", "")
          if latest and latest != version:
              sys.stderr.write(
                  "Update service kept latest at %s after publishing %s. "
                  "There is no yank or set-latest route; latest was not moved.\n"
                  % (latest, version)
              )
              sys.exit(1)
          ' <<<"${response}"

      - name: Upload latest pointer artifacts to R2
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          ARTIFACT_KEY: ${{ steps.meta.outputs.artifact_key }}
          LATEST_KEY: ${{ steps.meta.outputs.latest_key }}
          LATEST_META_KEY: ${{ steps.meta.outputs.latest_meta_key }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          MIN_PHP: ${{ steps.meta.outputs.min_php }}
          TESTED_UP_TO: ${{ steps.meta.outputs.tested_up_to }}
        run: |
          set -euo pipefail
          export META_FILE="${RUNNER_TEMP}/latest.json"
          python3 << 'PY'
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          payload = {
              "slug": os.environ["PLUGIN_SLUG"],
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "artifact_key": os.environ["ARTIFACT_KEY"],
              "latest_key": os.environ["LATEST_KEY"],
              "sha256": os.environ["SHA256"],
              "min_php": os.environ.get("MIN_PHP", ""),
              "tested_up_to": os.environ.get("TESTED_UP_TO", ""),
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          pathlib.Path(os.environ["META_FILE"]).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          aws s3 cp "${PLUGIN_SLUG}.zip" "s3://${{ secrets.R2_BUCKET }}/${LATEST_KEY}" \
            --endpoint-url "${{ steps.r2.outputs.endpoint }}" \
            --content-type "application/zip" \
            --cache-control "no-cache, max-age=0, must-revalidate"

          aws s3 cp "${META_FILE}" "s3://${{ secrets.R2_BUCKET }}/${LATEST_META_KEY}" \
            --endpoint-url "${{ steps.r2.outputs.endpoint }}" \
            --content-type "application/json" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      - name: Mirror pinned MainWP components to R2
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mirror_components.py --dest-dir "${RUNNER_TEMP}/components"
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          manifest = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "components", "mirror-manifest.json").read_text(encoding="utf-8"))
          endpoint = os.environ["R2_ENDPOINT"]
          bucket = os.environ["R2_BUCKET"]
          for component in manifest["components"]:
              for key in component["keys"]:
                  subprocess.check_call([
                      "aws", "s3", "cp", component["zip"], f"s3://{bucket}/{key}",
                      "--endpoint-url", endpoint,
                      "--content-type", "application/zip",
                      "--cache-control", "public, max-age=31536000, immutable",
                  ])
              for key in component["manifest_keys"]:
                  subprocess.check_call([
                      "aws", "s3", "cp", component["manifest"], f"s3://{bucket}/{key}",
                      "--endpoint-url", endpoint,
                      "--content-type", "application/json",
                      "--cache-control", "no-cache, max-age=0, must-revalidate",
                  ])
          PY
        env:
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
