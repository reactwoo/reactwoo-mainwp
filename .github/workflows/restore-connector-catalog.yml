name: Restore connector catalog

# Runs the connector publish workflow without a portal tag.
# A connector change on main is the release path. The publish job still
# uses the plugin header, and it publishes only when that header is higher
# than the catalog.

on:
  push:
    branches:
      - main
    paths:
      - "reactwoo-support-connector/**"
      - ".github/workflows/publish-update.yml"
      - ".github/workflows/restore-connector-catalog.yml"
      - "scripts/connector-catalog-restore.txt"
      - "scripts/resolve_connector_release.py"

permissions:
  contents: read

jobs:
  restore:
    uses: ./.github/workflows/publish-update.yml
    secrets: inherit
